<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小暖 · 情感陪护数字人</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f6f1e7;
    --card: #ffffff;
    --ink: #33302b;
    --muted: #8a8377;
    --green: #5b7b6f;
    --green-deep: #46614f;
    --terracotta: #c96f4a;
    --line: #e7dfd2;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  header {
    background: var(--green);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
  header p { font-size: 13px; opacity: .85; margin-top: 2px; }

  #clear-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    font-size: 14px;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  #clear-btn:hover { background: rgba(255,255,255,.15); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 18px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fade-in .25s ease;
  }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } }

  .msg.user {
    align-self: flex-end;
    background: var(--terracotta);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(60, 50, 30, .05);
  }

  .emotion {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 999px;
    background: #efe9dc;
    color: var(--muted);
  }
  .emotion.危机 { background: #fbe3e0; color: #b03a2e; font-weight: 600; }

  .hint {
    align-self: center;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    line-height: 1.7;
    max-width: 560px;
    margin-top: 8px;
  }

  footer {
    flex-shrink: 0;
    padding: 10px 16px 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .input-row {
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 8px 8px 8px 16px;
    box-shadow: 0 2px 8px rgba(60, 50, 30, .06);
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font: inherit;
    font-size: 18px;
    line-height: 1.5;
    padding: 8px 0;
    max-height: 120px;
    background: transparent;
    color: var(--ink);
  }

  #send-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 0 22px;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:hover { background: var(--green-deep); }
  #send-btn:disabled { opacity: .45; cursor: not-allowed; }

  .disclaimer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>小暖</h1>
    <p>情感陪护数字人 · 技术演示</p>
  </div>
  <button id="clear-btn" title="清空本次对话与记忆">清空对话</button>
</header>

<div id="chat">
  <div class="hint">
    我是小暖，陪您说说话。<br>
    您想聊聊最近的心情，或者问问睡眠、心里发慌这些事，都可以。
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="说点什么……（Enter 发送）"></textarea>
    <button id="send-btn">发送</button>
  </div>
  <p class="disclaimer">本服务为技术演示，不构成医疗建议。紧急情况请拨打心理援助热线 12356 或 120。</p>
</footer>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const clearBtn = document.getElementById('clear-btn');

  let sid = localStorage.getItem('xiaonuan_sid');
  if (!sid) {
    sid = 'web-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('xiaonuan_sid', sid);
  }

  let sending = false;

  const EMOTION_RE = /<emotion>(.*?)<\/emotion>/;

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function renderBot(div, raw) {
    const m = raw.match(EMOTION_RE);
    const text = raw.replace(EMOTION_RE, '').trim();
    div.textContent = text;
    if (m) {
      let badge = div.querySelector('.emotion');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'emotion';
        div.appendChild(badge);
        div.appendChild(document.createElement('br')); // 占位换行
        div.insertBefore(badge, div.lastChild);
      }
      badge.textContent = m[1].trim();
      badge.className = 'emotion ' + m[1].trim();
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sending) return;

    sending = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMessage('user', text);
    const botDiv = addMessage('bot', '……');

    let raw = '';
    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid, message: text }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          const event = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          if (!event.startsWith('data: ')) continue;
          const payload = event.slice(6);
          if (payload === '[DONE]') continue;
          try {
            const obj = JSON.parse(payload);
            if (obj.delta) {
              raw += obj.delta;
              renderBot(botDiv, raw);
            } else if (obj.error) {
              raw += '\n（出了点问题：' + obj.error + '）';
              renderBot(botDiv, raw);
            }
          } catch (_) { /* 忽略不完整帧 */ }
        }
      }
      if (!raw.trim()) renderBot(botDiv, '（没有收到回复，请再试一次）');
    } catch (err) {
      renderBot(botDiv, '（连接失败：' + err.message + '，请确认服务已启动）');
    } finally {
      sending = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  clearBtn.addEventListener('click', async () => {
    try {
      await fetch('/clear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sid }),
      });
    } catch (_) {}
    chatEl.querySelectorAll('.msg').forEach((el) => el.remove());
  });

  inputEl.focus();
</script>
</body>
</html>
